<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a2b4a" />
    <title>Login — Know Your Student</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Tokens ── */
      :root {
        --brand-navy: #1a2b4a;
        --brand-navy-mid: #243659;
        --brand-navy-light: #2f4575;
        --brand-amber: #e8940a;
        --brand-amber-light: #fbbf24;

        --color-success: #059669;
        --color-success-bg: #ecfdf5;
        --color-success-text: #065f46;
        --color-error: #dc2626;
        --color-error-bg: #fef2f2;
        --color-error-text: #991b1b;

        --bg-body: #f0f2f7;
        --bg-card: #ffffff;
        --bg-section: #f8f9fc;
        --bg-subsection: #f0f4fb;
        --bg-input: #ffffff;
        --bg-input-focus: #fafbff;

        --text-heading: #0f1f38;
        --text-body: #374151;
        --text-secondary: #6b7280;
        --text-placeholder: #9ca3af;
        --text-on-dark: #ffffff;

        --border-default: #d1d5db;
        --border-hover: #9ca3af;
        --border-focus: #2f4575;

        --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.06),
          0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08),
          0 2px 4px rgba(0, 0, 0, 0.04);
        --shadow-lg: 0 10px 24px rgba(0, 0, 0, 0.1),
          0 4px 8px rgba(0, 0, 0, 0.06);
        --shadow-xl: 0 20px 48px rgba(0, 0, 0, 0.12),
          0 8px 16px rgba(0, 0, 0, 0.06);

        --r-xs: 4px;
        --r-sm: 6px;
        --r-md: 8px;
        --r-lg: 12px;
        --r-xl: 16px;
        --r-2xl: 24px;
        --r-pill: 999px;

        --font-display: "Playfair Display", Georgia, serif;
        --font-body: "DM Sans", system-ui, sans-serif;

        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        --t-base: 200ms;
        --t-slow: 350ms;

        --input-h: 50px;
      }

      [data-theme="dark"] {
        --bg-body: #0c1424;
        --bg-card: #141f33;
        --bg-section: #1a2744;
        --bg-subsection: #1e2f50;
        --bg-input: #1a2744;
        --bg-input-focus: #1e2f50;

        --text-heading: #f0f4ff;
        --text-body: #cbd5e1;
        --text-secondary: #8898aa;
        --text-placeholder: #4a6080;

        --border-default: #2a3d5a;
        --border-hover: #3d5580;
        --border-focus: #5a80c0;
      }

      /* ── Reset ── */
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        font-size: 16px;
        -webkit-text-size-adjust: 100%;
      }

      body {
        font-family: var(--font-body);
        background: var(--bg-body);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 16px;
        transition: background var(--t-slow) var(--ease);
        position: relative;
        overflow-x: hidden;
      }

      /* Ambient background blobs */
      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
      }
      body::before {
        width: 500px;
        height: 500px;
        top: -160px;
        left: -120px;
        background: radial-gradient(
          circle,
          rgba(47, 69, 117, 0.12) 0%,
          transparent 70%
        );
      }
      body::after {
        width: 400px;
        height: 400px;
        bottom: -100px;
        right: -80px;
        background: radial-gradient(
          circle,
          rgba(232, 148, 10, 0.1) 0%,
          transparent 70%
        );
      }

      /* ── Card ── */
      .login-card {
        background: var(--bg-card);
        border: 1.5px solid var(--border-default);
        border-radius: var(--r-2xl);
        box-shadow: var(--shadow-xl);
        width: 100%;
        max-width: 440px;
        overflow: hidden;
        position: relative;
        z-index: 1;
        animation: cardIn var(--t-slow) var(--ease-bounce) both;
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* ── Card Header ── */
      .card-header {
        background: linear-gradient(
          135deg,
          var(--brand-navy) 0%,
          var(--brand-navy-light) 60%,
          #3a5a9a 100%
        );
        padding: 32px 28px 28px;
        position: relative;
        overflow: hidden;
      }

      /* Decorative radial glows */
      .card-header::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
            circle at 15% 30%,
            rgba(255, 255, 255, 0.06) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 85% 70%,
            rgba(232, 148, 10, 0.12) 0%,
            transparent 40%
          );
        pointer-events: none;
      }

      /* Top amber accent line */
      .card-header::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          var(--brand-amber) 0%,
          var(--brand-amber-light) 50%,
          var(--brand-amber) 100%
        );
      }

      .header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        position: relative;
        z-index: 1;
      }

      /* Brand mark */
      .brand-mark {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-icon {
        width: 38px;
        height: 38px;
        background: rgba(255, 255, 255, 0.12);
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--r-md);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .brand-icon svg {
        width: 20px;
        height: 20px;
        color: var(--brand-amber-light);
      }

      .brand-text {
        line-height: 1.2;
      }
      .brand-title {
        font-family: var(--font-display);
        font-size: 14px;
        font-weight: 700;
        color: #fff;
      }
      .brand-sub {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.45);
        font-weight: 300;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }

      /* Theme toggle in header */
      .header-theme-btn {
        width: 36px;
        height: 36px;
        background: rgba(255, 255, 255, 0.1);
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--r-pill);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background var(--t-base) var(--ease),
          transform var(--t-base) var(--ease-bounce);
        flex-shrink: 0;
      }
      .header-theme-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: rotate(18deg);
      }
      .header-theme-btn svg {
        width: 17px;
        height: 17px;
        color: rgba(255, 255, 255, 0.85);
      }
      .header-theme-btn .sun-icon {
        display: none;
      }
      .header-theme-btn .moon-icon {
        display: block;
      }
      [data-theme="dark"] .header-theme-btn .sun-icon {
        display: block;
      }
      [data-theme="dark"] .header-theme-btn .moon-icon {
        display: none;
      }

      .header-titles {
        position: relative;
        z-index: 1;
      }

      .card-eyebrow {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: rgba(255, 255, 255, 0.5);
        font-weight: 500;
        margin-bottom: 4px;
      }

      .card-title {
        font-family: var(--font-display);
        font-size: clamp(22px, 5vw, 27px);
        font-weight: 700;
        color: #fff;
        line-height: 1.15;
        margin-bottom: 4px;
      }

      .card-subtitle {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.6);
        font-weight: 300;
      }

      /* ── Form body ── */
      .card-body {
        padding: 28px 28px 32px;
        background: var(--bg-card);
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 20px;
      }

      .field-label {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--text-body);
      }

      .field-label .req {
        color: var(--color-error);
        font-size: 13px;
        line-height: 1;
        margin-left: 2px;
      }

      .input-wrap {
        position: relative;
      }

      .field-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        color: var(--text-secondary);
        pointer-events: none;
        transition: color var(--t-base) var(--ease);
      }

      .eye-btn {
        position: absolute;
        right: 0;
        top: 0;
        width: 50px;
        height: var(--input-h);
        background: none;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-secondary);
        -webkit-tap-highlight-color: transparent;
        transition: color var(--t-base) var(--ease);
      }
      .eye-btn svg {
        width: 17px;
        height: 17px;
      }
      .eye-btn:hover {
        color: var(--text-body);
      }

      .field-input {
        width: 100%;
        height: var(--input-h);
        padding: 0 14px 0 42px;
        border: 1.5px solid var(--border-default);
        border-radius: var(--r-md);
        font-family: var(--font-body);
        font-size: 15px;
        color: var(--text-body);
        background: var(--bg-input);
        box-shadow: var(--shadow-xs);
        outline: none;
        transition: border-color var(--t-base) var(--ease),
          background var(--t-base) var(--ease),
          box-shadow var(--t-base) var(--ease);
        -webkit-appearance: none;
      }

      .field-input.has-eye {
        padding-right: 48px;
      }

      .field-input::placeholder {
        color: var(--text-placeholder);
      }

      .field-input:focus {
        border-color: var(--border-focus);
        background: var(--bg-input-focus);
        box-shadow: 0 0 0 3px rgba(47, 69, 117, 0.15);
      }

      .field-input:focus + .field-icon,
      .input-wrap:focus-within .field-icon {
        color: var(--brand-navy-light);
      }

      [data-theme="dark"] .field-input:focus {
        box-shadow: 0 0 0 3px rgba(90, 128, 192, 0.2);
      }

      .field-input.error {
        border-color: var(--color-error) !important;
        background: var(--color-error-bg) !important;
        box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12) !important;
      }

      .field-error {
        font-size: 12px;
        font-weight: 500;
        color: var(--color-error);
        line-height: 1.4;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: max-height var(--t-base) var(--ease),
          opacity var(--t-base) var(--ease), margin var(--t-base) var(--ease);
      }

      .field-error.show {
        max-height: 40px;
        opacity: 1;
        margin-top: 2px;
      }

      /* ── Options row ── */
      .options-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        gap: 12px;
      }

      .checkbox-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .checkbox-wrap input[type="checkbox"] {
        width: 17px;
        height: 17px;
        border: 2px solid var(--border-default);
        border-radius: var(--r-xs);
        appearance: none;
        -webkit-appearance: none;
        background: var(--bg-input);
        cursor: pointer;
        transition: background var(--t-base) var(--ease),
          border-color var(--t-base) var(--ease);
        flex-shrink: 0;
        position: relative;
      }

      .checkbox-wrap input[type="checkbox"]:checked {
        background: var(--brand-navy);
        border-color: var(--brand-navy);
      }

      .checkbox-wrap input[type="checkbox"]:checked::after {
        content: "";
        position: absolute;
        top: 1px;
        left: 4px;
        width: 6px;
        height: 10px;
        border: 2px solid white;
        border-top: none;
        border-left: none;
        transform: rotate(45deg);
      }

      .checkbox-label {
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 500;
        user-select: none;
      }

      /* ── Submit button ── */
      .submit-btn {
        width: 100%;
        height: 50px;
        background: linear-gradient(
          135deg,
          var(--brand-navy) 0%,
          var(--brand-navy-light) 100%
        );
        color: #fff;
        border: none;
        border-radius: var(--r-md);
        font-family: var(--font-body);
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        box-shadow: 0 3px 10px rgba(26, 43, 74, 0.3);
        transition: transform var(--t-base) var(--ease-bounce),
          box-shadow var(--t-base) var(--ease);
        -webkit-tap-highlight-color: transparent;
      }

      /* Shimmer sweep */
      .submit-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.18),
          transparent
        );
        transition: left 0.55s var(--ease);
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(26, 43, 74, 0.38);
      }
      .submit-btn:hover::before {
        left: 100%;
      }
      .submit-btn:active {
        transform: scale(0.98);
      }
      .submit-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none !important;
        box-shadow: none !important;
      }

      .btn-inner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 600ms linear infinite;
        display: none;
        flex-shrink: 0;
      }

      .submit-btn.loading .btn-text {
        display: none;
      }
      .submit-btn.loading .btn-spinner {
        display: block;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── Feedback ── */
      .form-feedback {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: var(--r-md);
        font-size: 13px;
        font-weight: 500;
        line-height: 1.5;
        display: none;
        border: 1.5px solid transparent;
      }

      .form-feedback.show {
        display: block;
        animation: feedbackIn var(--t-base) var(--ease) both;
      }

      @keyframes feedbackIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .form-feedback.error {
        background: var(--color-error-bg);
        color: var(--color-error-text);
        border-color: rgba(220, 38, 38, 0.2);
      }

      .form-feedback.success {
        background: var(--color-success-bg);
        color: var(--color-success-text);
        border-color: rgba(5, 150, 105, 0.2);
      }

      /* ── Divider ── */
      .card-divider {
        height: 1px;
        background: var(--border-default);
        margin: 4px 0 20px;
      }

      /* ── Responsive ── */
      @media (max-width: 480px) {
        .card-header {
          padding: 24px 20px 22px;
        }
        .card-body {
          padding: 22px 20px 28px;
        }
        .card-title {
          font-size: 22px;
        }
      }

      @media (max-width: 360px) {
        .card-header,
        .card-body {
          padding-left: 16px;
          padding-right: 16px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-card">
      <!-- Header -->
      <div class="card-header">
        <div class="header-top">
          <div class="brand-mark">
            <div class="brand-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 14l9-5-9-5-9 5 9 5z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"
                />
              </svg>
            </div>
            <div class="brand-text">
              <div class="brand-title">KYS Portal</div>
              <div class="brand-sub">Know Your Student</div>
            </div>
          </div>
          <button
            class="header-theme-btn"
            id="themeToggle"
            title="Toggle theme"
          >
            <svg
              class="sun-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
              />
            </svg>
            <svg
              class="moon-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
              />
            </svg>
          </button>
        </div>
        <div class="header-titles">
          <p class="card-eyebrow">Secure Sign In</p>
          <h1 class="card-title">Welcome Back</h1>
          <p class="card-subtitle">Sign in to your account to continue</p>
        </div>
      </div>

      <!-- Form Body -->
      <div class="card-body">
        <form id="loginForm" novalidate autocomplete="off">
          <!-- Username -->
          <div class="field-group">
            <label class="field-label" for="username">
              Username <span class="req">*</span>
            </label>
            <div class="input-wrap">
              <input
                type="text"
                id="username"
                name="username"
                class="field-input"
                placeholder="Enter your username"
                required
                autocomplete="username"
              />
              <svg
                class="field-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                />
              </svg>
            </div>
            <div class="field-error" id="usernameError"></div>
          </div>

          <!-- Password -->
          <div class="field-group">
            <label class="field-label" for="password">
              Password <span class="req">*</span>
            </label>
            <div class="input-wrap">
              <input
                type="password"
                id="password"
                name="password"
                class="field-input has-eye"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              />
              <svg
                class="field-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                />
              </svg>
              <button
                type="button"
                class="eye-btn"
                id="eyeToggle"
                title="Show/hide password"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                  />
                </svg>
              </button>
            </div>
            <div class="field-error" id="passwordError"></div>
          </div>

          <div class="card-divider"></div>

          <!-- Options -->
          <div class="options-row">
            <label class="checkbox-wrap">
              <input type="checkbox" id="remember" />
              <span class="checkbox-label">Remember me</span>
            </label>
          </div>

          <!-- Submit -->
          <button type="submit" class="submit-btn" id="loginBtn">
            <div class="btn-inner">
              <span class="btn-text">Sign In</span>
              <div class="btn-spinner"></div>
            </div>
          </button>

          <!-- Feedback -->
          <div class="form-feedback" id="formFeedback"></div>
        </form>
      </div>
    </div>

    <script>
      /* ── Theme ── */
      (function () {
        const saved = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", saved);
      })();

      document.getElementById("themeToggle").addEventListener("click", () => {
        const next =
          document.documentElement.getAttribute("data-theme") === "dark"
            ? "light"
            : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });

      /* ── Eye toggle ── */
      document.getElementById("eyeToggle").addEventListener("click", () => {
        const pw = document.getElementById("password");
        pw.type = pw.type === "password" ? "text" : "password";
      });

      /* ── Login Manager ── */
      function resolveApiBase() {
        const explicit =
          window.__API_BASE__ || localStorage.getItem("api_base_url");
        if (explicit) return explicit.replace(/\/+$/, "");

        if (window.location.protocol === "file:") return "http://localhost:5002";

        const host = window.location.hostname;
        if (host === "localhost" || host === "127.0.0.1")
          return "http://localhost:5002";

        // Production default: same origin as served frontend
        return window.location.origin;
      }

      class LoginManager {
        constructor() {
          this.baseURL = resolveApiBase();
          this.form = document.getElementById("loginForm");
          this.usernameEl = document.getElementById("username");
          this.passwordEl = document.getElementById("password");
          this.loginBtn = document.getElementById("loginBtn");
          this.feedback = document.getElementById("formFeedback");
          this.remember = document.getElementById("remember");

          this.bindEvents();
        }

        bindEvents() {
          this.form.addEventListener("submit", (e) => this.handleSubmit(e));

          [
            ["username", "usernameError", (v) => this.validateUsername(v)],
            ["password", "passwordError", (v) => this.validatePassword(v)],
          ].forEach(([id, errId, fn]) => {
            const el = document.getElementById(id);
            el.addEventListener("blur", () =>
              this.validateField(el, errId, fn),
            );
            el.addEventListener("input", () => this.clearError(el, errId));
          });
        }

        validateField(input, errId, fn) {
          const result = fn(input.value.trim());
          const errEl = document.getElementById(errId);
          if (!result.valid) {
            input.classList.add("error");
            errEl.textContent = result.message;
            errEl.classList.add("show");
            return false;
          }
          input.classList.remove("error");
          errEl.classList.remove("show");
          return true;
        }

        clearError(input, errId) {
          input.classList.remove("error");
          document.getElementById(errId).classList.remove("show");
        }

        validateUsername(v) {
          if (!v) return { valid: false, message: "Username is required." };
          if (v.length < 3)
            return { valid: false, message: "At least 3 characters required." };
          return { valid: true };
        }

        validatePassword(v) {
          if (!v) return { valid: false, message: "Password is required." };
          if (v.length < 6)
            return { valid: false, message: "At least 6 characters required." };
          return { valid: true };
        }

        showFeedback(type, msg) {
          this.feedback.textContent = msg;
          this.feedback.className = "form-feedback show " + type;
        }

        hideFeedback() {
          this.feedback.className = "form-feedback";
        }

        setLoading(on) {
          this.loginBtn.disabled = on;
          this.loginBtn.classList.toggle("loading", on);
        }

        async handleSubmit(e) {
          e.preventDefault();
          this.hideFeedback();

          const uOk = this.validateField(
            this.usernameEl,
            "usernameError",
            (v) => this.validateUsername(v),
          );
          const pOk = this.validateField(
            this.passwordEl,
            "passwordError",
            (v) => this.validatePassword(v),
          );
          if (!uOk || !pOk) return;

          this.setLoading(true);

          try {
            const res = await fetch(`${this.baseURL}/api/auth/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                uid: this.usernameEl.value.trim(),
                password: this.passwordEl.value,
              }),
            });

            const data = await res.json();

            if (res.ok) {
              const token = data.access_token || data.accessToken;
              localStorage.setItem("access_token", token);
              if (data.user?.role)
                localStorage.setItem("user_role", data.user.role);
              if (this.remember.checked)
                localStorage.setItem(
                  "remember_user",
                  this.usernameEl.value.trim(),
                );

              this.showFeedback("success", "✓ Login successful! Redirecting…");

              setTimeout(() => {
                this.redirectUser(
                  data.user?.role || localStorage.getItem("user_role"),
                );
              }, 1200);
            } else {
              this.showFeedback(
                "error",
                data.error || "Invalid credentials. Please try again.",
              );
              this.setLoading(false);
            }
          } catch (err) {
            console.error(err);
            const isNetworkError = err instanceof TypeError;
            this.showFeedback(
              "error",
              isNetworkError
                ? `Backend unreachable at ${this.baseURL}. Start Flask/WSGI or set localStorage.api_base_url.`
                : "Network error. Please check your connection.",
            );
            this.setLoading(false);
          }
        }

        redirectUser(role) {
          const map = {
            admin: "./Admin/a.html",
            faculty: "./Teacher/t.html",
            student: "./Student/dashboard.html",
          };
          window.location.href = map[role] || "./homepage.html";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const mgr = new LoginManager();

        // Pre-fill remembered user
        const rem = localStorage.getItem("remember_user");
        if (rem) {
          document.getElementById("username").value = rem;
          document.getElementById("remember").checked = true;
        }

        // Auto-redirect if already logged in
        const token = localStorage.getItem("access_token");
        if (token) {
          fetch(`${mgr.baseURL}/api/auth/verify-token`, {
            headers: { Authorization: `Bearer ${token}` },
          })
            .then((r) => r.json())
            .then((res) => {
              if (res?.valid)
                mgr.redirectUser(
                  res.user?.role || localStorage.getItem("user_role"),
                );
            })
            .catch(() => {});
        }
      });
    </script>
  </body>
</html>
