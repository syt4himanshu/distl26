<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .student-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .student-card { padding: 15px; border: 1px solid #ddd; border-radius: 5px; background: #f9f9f9; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Panel - API Integration Test</h1>
        
        <!-- Authentication Status -->
        <div class="section">
            <h2>Authentication Status</h2>
            <div id="auth-status" class="status warning">Not authenticated</div>
            <button onclick="testLogin()">Login as Admin</button>
            <button onclick="checkAuth()">Check Authentication</button>
            <button onclick="logout()">Logout</button>
        </div>
        
        <!-- API Testing -->
        <div class="section">
            <h2>API Testing</h2>
            <button onclick="loadStudentsFromAPI()">Load Students from API</button>
            <button onclick="showRawAPIData()">Show Raw API Data</button>
            <div id="api-status"></div>
        </div>
        
        <!-- Students Display -->
        <div class="section">
            <h2>Students (<span id="student-count">0</span>)</h2>
            <div id="students-container">
                <p>Click "Load Students from API" to fetch data</p>
            </div>
        </div>
        
        <!-- Debug Info -->
        <div class="section">
            <h2>Debug Information</h2>
            <button onclick="showDebugInfo()">Show Debug Info</button>
            <div id="debug-info"></div>
        </div>
    </div>

    <script>
        let students = [];
        let authToken = null;
        
        // Check authentication status on load
        window.addEventListener('load', function() {
            checkAuth();
        });
        
        function updateStatus(elementId, message, type = 'warning') {
            const element = document.getElementById(elementId);
            element.className = `status ${type}`;
            element.textContent = message;
        }
        
        function updateAuthStatus() {
            const token = localStorage.getItem('access_token');
            if (token) {
                authToken = token;
                updateStatus('auth-status', '✅ Authenticated (Token found)', 'success');
            } else {
                authToken = null;
                updateStatus('auth-status', '❌ Not authenticated', 'error');
            }
        }
        
        async function testLogin() {
            try {
                updateStatus('auth-status', '🔄 Logging in...', 'warning');
                
                const response = await fetch('http://localhost:5002/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Login successful:', data);
                    
                    if (data.access_token) {
                        localStorage.setItem('access_token', data.access_token);
                        authToken = data.access_token;
                        updateStatus('auth-status', `✅ Login successful! Role: ${data.role}`, 'success');
                    } else {
                        updateStatus('auth-status', '❌ Login failed: No token received', 'error');
                    }
                } else {
                    const errorData = await response.json();
                    updateStatus('auth-status', `❌ Login failed: ${errorData.message || response.statusText}`, 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                updateStatus('auth-status', `❌ Login error: ${error.message}`, 'error');
            }
        }
        
        async function checkAuth() {
            updateAuthStatus();
            
            if (!authToken) {
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5002/api/auth/verify', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    updateStatus('auth-status', `✅ Token valid! User: ${data.username}, Role: ${data.role}`, 'success');
                } else {
                    updateStatus('auth-status', '❌ Token invalid or expired', 'error');
                    localStorage.removeItem('access_token');
                    authToken = null;
                }
            } catch (error) {
                updateStatus('auth-status', `❌ Auth check error: ${error.message}`, 'error');
            }
        }
        
        function logout() {
            localStorage.removeItem('access_token');
            authToken = null;
            students = [];
            updateAuthStatus();
            updateStudentsDisplay();
        }
        
        async function loadStudentsFromAPI() {
            if (!authToken) {
                updateStatus('api-status', '❌ Please login first', 'error');
                return;
            }
            
            try {
                updateStatus('api-status', '🔄 Loading students...', 'warning');
                
                const response = await fetch('http://localhost:5002/api/students', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const studentsData = await response.json();
                    console.log('Students loaded:', studentsData);
                    
                    students = studentsData;
                    updateStatus('api-status', `✅ Loaded ${students.length} students`, 'success');
                    updateStudentsDisplay();
                } else {
                    const errorData = await response.text();
                    updateStatus('api-status', `❌ Failed to load students: ${response.status} ${errorData}`, 'error');
                }
            } catch (error) {
                console.error('Students API error:', error);
                updateStatus('api-status', `❌ API error: ${error.message}`, 'error');
            }
        }
        
        async function showRawAPIData() {
            if (!authToken) {
                alert('Please login first');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5002/api/students', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const rawData = await response.text();
                const debugDiv = document.getElementById('debug-info');
                debugDiv.innerHTML = `<h3>Raw API Response:</h3><pre>${rawData}</pre>`;
            } catch (error) {
                alert('Error fetching raw data: ' + error.message);
            }
        }
        
        function updateStudentsDisplay() {
            const container = document.getElementById('students-container');
            const countSpan = document.getElementById('student-count');
            
            countSpan.textContent = students.length;
            
            if (students.length === 0) {
                container.innerHTML = '<p>No students found. Try loading from API.</p>';
                return;
            }
            
            let html = '<table><tr><th>UID</th><th>Name</th><th>Semester</th><th>Section</th><th>Year</th></tr>';
            
            students.forEach(student => {
                const fullName = `${student.firstName || student.first_name || ''} ${student.middleName || student.middle_name || ''} ${student.lastName || student.last_name || ''}`.trim();
                html += `
                    <tr>
                        <td>${student.uid || 'N/A'}</td>
                        <td>${fullName || 'Unknown'}</td>
                        <td>${student.semester || 'N/A'}</td>
                        <td>${student.section || 'N/A'}</td>
                        <td>${student.year_of_admission || student.year || 'N/A'}</td>
                    </tr>
                `;
            });
            
            html += '</table>';
            container.innerHTML = html;
        }
        
        function showDebugInfo() {
            const debugDiv = document.getElementById('debug-info');
            const info = {
                authToken: authToken ? 'Present' : 'Missing',
                studentsCount: students.length,
                localStorage: {
                    access_token: localStorage.getItem('access_token') ? 'Present' : 'Missing'
                },
                currentURL: window.location.href,
                backendURL: 'http://localhost:5002',
                frontendURL: 'http://localhost:8000'
            };
            
            debugDiv.innerHTML = `<h3>Debug Information:</h3><pre>${JSON.stringify(info, null, 2)}</pre>`;
        }
    </script>
</body>
</html>
